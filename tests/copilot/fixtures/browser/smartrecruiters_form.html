<!doctype html>
<html>
<head><title>SmartRecruiters — Apply</title></head>
<body>
<!-- D-035 fixture: a SmartRecruiters application form. Identity fields +
     resume upload + submit/apply control → APPLICATION. -->
<h1>Staff Software Engineer</h1>
<form id="application_form" action="/apply/123">
  <label for="firstName">First Name</label>
  <input id="firstName" name="firstName" type="text" required>

  <label for="lastName">Last Name</label>
  <input id="lastName" name="lastName" type="text" required>

  <label for="email">Email</label>
  <input id="email" name="email" type="email" required>

  <label for="phone">Phone</label>
  <input id="phone" name="phone" type="tel">

  <label for="linkedin">LinkedIn</label>
  <input id="linkedin" name="linkedin" type="url">

  <label for="resume">Resume/CV</label>
  <input id="resume" name="resume" type="file" required>

  <label for="source">How did you hear about this job?</label>
  <select id="source" name="source">
    <option value="">Select...</option>
    <option value="linkedin">LinkedIn</option>
    <option value="referral">Referral</option>
    <option value="website">Company Website</option>
  </select>

  <label for="start">Earliest start date</label>
  <input id="start" name="start" type="date">

  <label for="years">Years of experience</label>
  <input id="years" name="years" type="number">

  <textarea id="cover" name="cover_letter" placeholder="Cover letter"></textarea>

  <input type="submit" value="Submit Application">
</form>
</body>
</html>
