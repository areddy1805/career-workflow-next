[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "career-workflow"
version = "4.0.0"
description = "Policy-Driven AI Job Discovery, Qualification, and Application Orchestration Engine"
authors = [
  { name="Abhilash Reddy" }
]
[project.scripts]
cw = "src.cli.main:app"
[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]

ignore = [
    "F403",
    "F405",
]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]