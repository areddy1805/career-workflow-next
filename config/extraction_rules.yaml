  created: "2026-07-24"
  updated: "2026-07-24"
  checksum: "a1b2c3d4e5f6"

seniority:
  entry_level: ["junior", "entry level", "fresher", "0-2 years", "trainee", "associate"]
  mid_level: ["mid level", "mid-level", "2-5 years", "3-5 years"]
  senior: ["senior", "sr.", "sr ", "lead", "principal", "staff", "5+ years", "architect"]
  executive: ["director", "vp", "head of", "cto", "manager"]

work_mode:
  remote: ["remote", "work from home", "wfh", "telecommute"]
