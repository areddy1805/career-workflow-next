# config/ranking.yaml
meta:
  version: "1.1.0"
  created: "2026-07-24"

hard_filters:
  - id: visa_required
    field: work_authorization
    condition: "equals"
    value: 0.0
    action: "REJECT"
    reason: "Visa sponsorship required but candidate requires authorized employer"

boosts:
  - id: ai_boost
    field: ai_score
    threshold: 0.5
    value: 15.0
    reason: "Strong AI relevance boost"
  - id: angular_boost
    field: angular_score
    threshold: 0.8
    value: 10.0
    reason: "High Angular skill match boost"
  - id: python_boost
    field: python_score
    threshold: 0.8
    value: 15.0
    reason: "High Python skill match boost"

penalties:
  - id: missing_salary_penalty
    field: missing_salary
    threshold: 0.5
    value: -3.0
    reason: "Missing salary information penalty"

thresholds:
  min_score_auto_apply: 80.0
  min_score_llm_classify: 35.0
  min_confidence_auto_bypass: 80.0
